name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_GITHUB_OWNER: inyuo
  VITE_GITHUB_REPO: inyuo.github.io
  VITE_GITHUB_URL: https://github.com/inyuo
  VITE_TITLE: inyuo
  VITE_APP_TITLE: Blog
  VITE_GITHUB_MILESTONE_POSTS: 1
  VITE_GITHUB_MILESTONE_SNIPPETS: 2
  VITE_ARTICLE_PAGE_SIZE: 10
  VITE_COMMENT_PAGE_SIZE: 30

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4